<!DOCTYPE html><html lang="id"><head><title>Siaran Pers - BMKG</title></head><body><h1>Siaran Pers</h1><script type="application/json" id="__NUXT_DATA__">[["ShallowReactive",1],{"data":2,"state":94,"once":111,"_errors":112,"serverRendered":108,"path":114},["ShallowReactive",3],{"$f3jh5mykck2sjr":4,"$fzh4xyxr96d1l":5,"$f1eth3k3ni7exq":14},[],[6],{"total":7,"date":8,"title":9,"slug":10,"excerpt":11,"featured_image":12},1019,"2026-10-27 11:38:37","BMKG: Siklon Tropis ARNAB Tak Berdampak, Tetap Waspadai Potensi Hujan Lebat di Sejumlah Wilayah Sepekan ke Depan","bmkg-siklon-tropis-arnab-tak-berdampak-tetap-waspadai-potensi-hujan-lebat-di-sejumlah-wilayah-sepekan-ke-depan","Badan Meteorologi, Klimatologi, dan Geofisika (BMKG) mencatat kejadian hujan berintensitas sedang hingga ekstrem yang mengguyur sejumlah wilayah di Aceh dan Sumatra Utara dalam tiga hari terakhir. Data pengamatan stasiun meteorologi menunjukkan curah hujan harian tertinggi mencapai 187 milimeter di Pos Hujan Kluet Tengah, Kabupaten Aceh Selatan, serta 103 milimeter di Pos Hujan Lobu Rampah, Kabupaten Labuhanbatu Utara pada 25 Oktober 2026.",{"large":13},"https://i0.wp.com/content.bmkg.go.id/wp-content/uploads/WhatsApp-Image-2026-10-27-at-07.37.33.jpeg?fit=1280%2C854&ssl=1",[15,17,24,31,38,45,52,59,66,73,80,87],{"total":7,"date":8,"title":9,"slug":10,"excerpt":11,"featured_image":16},{"large":13},{"total":7,"date":18,"title":19,"slug":20,"excerpt":21,"featured_image":22},"2026-10-27 07:58:25","Siklon Tropis ARNAB di Laut Andaman Bergerak Menjauh, Waspadai Pembentukan Sirkulasi Siklonik Baru","siklon-tropis-arnab-di-laut-andaman-bergerak-menjauh-waspadai-pembentukan-sirkulasi-siklonik-baru","Jakarta, 27 Oktober 2026 — Badan Meteorologi, Klimatologi, dan Geofisika (BMKG) mengonfirmasi adanya perkembangan sistem siklonik 98B di Laut Andaman sejak 19 Oktober 2026 dengan sirkulasi lemah. Sistem ini berkembang menjadi Siklon Tropis ARNAB di Teluk Benggala dengan pergerakan menjauhi Indonesia.",{"large":23},"https://i0.wp.com/content.bmkg.go.id/wp-content/uploads/WhatsApp-Image-2026-10-27-at-07.41.55.jpeg?fit=1280%2C526&ssl=1",{"total":7,"date":25,"title":26,"slug":27,"excerpt":28,"featured_image":29},"2026-10-24 17:53:00","Tekan Polusi Udara dan Suhu Panas Jakarta, BMKG-BPBD DKI Laksanakan Modifikasi Cuaca","tekan-polusi-udara-dan-suhu-panas-jakarta-bmkg-bpbd-dki-laksanakan-modifikasi-cuaca","Jakarta, 23 Oktober 2026 — Badan Meteorologi, Klimatologi, dan Geofisika (BMKG) bersama Badan Penanggulangan Bencana Daerah (BPBD) Provinsi DKI Jakarta melaksanakan operasi modifikasi cuaca (OMC) di wilayah Jakarta sepanjang 21—25 Oktober 2026. Operasi ini bertujuan menurunkan polusi udara yang dapat mengganggu jalannya event yang diselenggarakan oleh Pemerintah Provinsi DKI.",{"large":30},"https://i0.wp.com/content.bmkg.go.id/wp-content/uploads/WhatsApp-Image-2026-10-24-at-16.31.32.jpeg?fit=1280%2C960&ssl=1",{"total":7,"date":32,"title":33,"slug":34,"excerpt":35,"featured_image":36},"2026-10-20 19:54:41","BMKG: Pemerintah Manfaatkan Dry Ice untuk Urai Kabut Asap Karhutla di Sumatra dan Kalimantan","bmkg-pemerintah-manfaatkan-dry-ice-untuk-urai-kabut-asap-karhutla-di-sumatra-dan-kalimantan","Jakarta, 20 Oktober 2026 – Badan Meteorologi, Klimatologi, dan Geofisika (BMKG) bersama seluruh unsur terkait seperti TNI, BNPB, Kemenhut, Kemenhan, dan BRIN mengimplementasikan penyemaian dry ice atau es kering melalui Operasi Modifikasi Cuaca (OMC) untuk membantu mengurai kabut asap pekat akibat kebakaran hutan dan lahan (karhutla) di wilayah Sumatra dan Kalimantan. Teknik ini menargetkan lapisan inversi atmosfer yang menahan asap di dekat permukaan, terutama ketika awan potensial untuk penyemaian hujan terbatas.",{"large":37},"https://i0.wp.com/content.bmkg.go.id/wp-content/uploads/WhatsApp-Image-2026-10-20-at-17.53.05.jpeg?fit=1280%2C854&ssl=1",{"total":7,"date":39,"title":40,"slug":41,"excerpt":42,"featured_image":43},"2026-10-17 16:08:48","BMKG: Asap Sempat Terpantau Sesaat di Jabodetabek, Kini Sudah Menjauh","bmkg-asap-sempat-terpantau-sesaat-di-jabodetabek-kini-sudah-menjauh","Badan Meteorologi, Klimatologi, dan Geofisika (BMKG) memantau sebaran asap kebakaran hutan dan lahan (karhutla) yang mulai menjauhi wilayah Jawa bagian Barat, termasuk Jakarta, Bogor, Depok, Tangerang, dan Bekasi (Jabodetabek), sejak Sabtu, 17 Oktober 2026. Meski demikian, BMKG masih mendeteksi sisa sebaran asap di Pesisir Barat Banten pada ketinggian sekitar 10.000–18.000 kaki atau 3–5,4 kilometer.",{"large":44},"https://i0.wp.com/content.bmkg.go.id/wp-content/uploads/WhatsApp-Image-2026-10-17-at-16.09.57.jpeg?fit=1280%2C947&ssl=1",{"total":7,"date":46,"title":47,"slug":48,"excerpt":49,"featured_image":50},"2026-10-17 12:28:43","BMKG: Dampak Gempa Bogor M3,5 dan M4,1, Ratusan Rumah dan Fasilitas Ibadah Terdampak","bmkg-dampak-gempa-bogor-m3-5-dan-m4-1-ratusan-rumah-dan-fasilitas-ibadah-terdampak","Badan Meteorologi, Klimatologi, dan Geofisika (BMKG) melakukan survei lapangan untuk memverifikasi dampak dua kejadian gempa bumi yang mengguncang wilayah Bogor, Jawa Barat, pada 15 Oktober 2026.",{"large":51},"https://i0.wp.com/content.bmkg.go.id/wp-content/uploads/WhatsApp-Image-2026-10-17-at-11.06.04.jpeg?fit=1280%2C960&ssl=1",{"total":7,"date":53,"title":54,"slug":55,"excerpt":56,"featured_image":57},"2026-10-08 19:18:44","BMKG Resmikan HF Radar Array Ujong Batee Aceh, Perkuat Observasi Maritim dan Mitigasi Bencana Pesisir","bmkg-resmikan-hf-radar-array-ujong-batee-aceh-perkuat-observasi-maritim-dan-mitigasi-bencana-pesisir","Badan Meteorologi, Klimatologi, dan Geofisika (BMKG) meresmikan pengoperasian High Frequency (HF) Radar Array di Ujong Batee, Kabupaten Aceh Besar, Provinsi Aceh. Kehadiran teknologi ini merupakan bagian dari upaya BMKG memperkuat sistem observasi kelautan, meningkatkan kualitas layanan informasi meteorologi maritim, serta mendukung sistem mitigasi bencana di wilayah pesisir.",{"large":58},"https://i0.wp.com/content.bmkg.go.id/wp-content/uploads/WhatsApp-Image-2026-10-08-at-18.34.09.jpeg?fit=1280%2C853&ssl=1",{"total":7,"date":60,"title":61,"slug":62,"excerpt":63,"featured_image":64},"2026-10-04 09:52:13","Gempa Sumba Barat Daya Tak Berpotensi Tsunami, BMKG Imbau Warga Waspadai Bangunan Retak","gempa-sumba-barat-daya-tak-berpotensi-tsunami-bmkg-imbau-warga-waspadai-bangunan-retak","Badan Meteorologi, Klimatologi, dan Geofisika (BMKG) melaporkan telah terjadi Gempa Bumi tektonik M6,1 dengan parameter update M5.9 yang mengguncang wilayah Pantai Barat Daya Sumba Barat Daya, Nusa Tenggara Timur, pada Minggu (4/10/2026) pukul 05.55.52 WIB. Hasil pemodelan tsunami menunjukkan bahwa gempa bumi ini tidak berpotensi tsunami.",{"large":65},"https://i0.wp.com/content.bmkg.go.id/wp-content/uploads/WhatsApp-Image-2026-10-04-at-10.21.26.jpeg?fit=1280%2C853&ssl=1",{"total":7,"date":67,"title":68,"slug":69,"excerpt":70,"featured_image":71},"2026-09-22 11:31:36","BMKG: El Niño Sangat Kuat sedang Terjadi, Musim Hujan 2026/2027 Diprediksi Datang Lebih Lambat","bmkg-el-nino-sangat-kuat-sedang-terjadi-musim-hujan-2026-2027-diprediksi-datang-lebih-lambat","Jakarta, 22 September 2026 — Badan Meteorologi, Klimatologi, dan Geofisika (BMKG) memprediksi awal musim hujan periode 2026-2027 di 529 Zona Musim (ZOM) atau 61,08% wilayah Indonesia akan mengalami kemunduran dari rerata klimatologisnya. Fenomena El Niño dengan intensitas sangat kuat dan Indian Ocean Dipole (IOD) di samudra sekitar Indonesia berdampak pada berkurangnya curah hujan.",{"large":72},"https://i0.wp.com/content.bmkg.go.id/wp-content/uploads/621A0983.jpg?fit=1280%2C853&ssl=1",{"total":7,"date":74,"title":75,"slug":76,"excerpt":77,"featured_image":78},"2026-09-17 11:56:00","Rangkaian Gempa Bumi di Kabupaten Bandung dan Sekitarnya 11 Agustus-17 September 2026","rangkaian-gempa-bumi-di-kabupaten-bandung-dan-sekitarnya-11-agustus-17-september-2026","Terkait rangkaian gempa bumi yang terjadi di wilayah Kabupaten Bandung, tanggal 11 Agustus – 17 September 2026 hingga pukul 08:00 WIB, BMKG telah mencatat 118 aktivitas gempa bumi dengan kekuatan berkisar M1,0-M3,4, diantaranya terjadi 13 kali gempa bumi dirasakan di Pangalengan, Talegong, Cisewu dan sekitarnya dengan intensitas II-III MMI (Getaran dirasakan nyata dalam rumah, terasa getaran seakan-akan truk berlalu). Dengan memperhatikan lokasi pusat gempa, gempa bumi yang terjadi merupakan jenis gempa bumi dangkal. Hasil analisis BMKG menunjukkan bahwa pusat gempa bumi membentuk pola kelurusan ke arah Barat Daya-Timur Laut dengan jarak sekitar 5-8 Km sebelah Barat Sesar Garsela Segmen Kendang dan sebelah Utara Sesar Garsela Segmen Kencana, secara tektonik gempa bumi tersebut berkaitan dengan aktivitas sesar lokal.",{"large":79},"https://i0.wp.com/content.bmkg.go.id/wp-content/uploads/WhatsApp-Image-2026-09-17-at-11.48.21.jpeg?fit=1280%2C905&ssl=1",{"total":7,"date":81,"title":82,"slug":83,"excerpt":84,"featured_image":85},"2026-09-15 16:16:22","Gempa Flores Meluruh, BMKG Ungkap Hasil Survei Lapangan sebagai Basis Mitigasi dan Rekonstruksi","gempa-flores-meluruh-bmkg-ungkap-hasil-survei-lapangan-sebagai-basis-mitigasi-dan-rekonstruksi","Badan Meteorologi, Klimatolog, dan Geofisika (BMKG) menjelaskan bahwa aktivitas gempa susulan pascagempa bumi Flores M7,7 yang terjadi pada 15 Agustus 2026 lalu kini telah memasuki fase peluruhan secara signifikan. BMKG mengimbau masyarakat untuk tetap waspada dan tenang, serta terus memantau informasi resmi saat proses rehabilitasi dan rekonstruksi wilayah terdampak mulai berjalan.",{"large":86},"https://i0.wp.com/content.bmkg.go.id/wp-content/uploads/WhatsApp-Image-2026-09-15-at-16.12.16.jpeg?fit=1280%2C853&ssl=1",{"total":7,"date":88,"title":89,"slug":90,"excerpt":91,"featured_image":92},"2026-09-11 12:29:20","BMKG Imbau Masyarakat Saling Jaga Kebenaran Informasi","bmkg-imbau-masyarakat-saling-jaga-kebenaran-informasi","Belakangan ini, publik menemukan tangkapan layar di media sosial yang mengesankan seolah-olah akun resmi infoBMKG memberikan jawaban tidak responsif terhadap unggahan Sekretariat Kabinet. BMKG menegaskan bahwa tuduhan tersebut sama sekali tidak benar karena pihak yang tidak bertanggung jawab telah menyunting (crop/combine) gambar-gambar tersebut sehingga memicu mispersepsi di masyarakat.",{"large":93},"https://i0.wp.com/content.bmkg.go.id/wp-content/uploads/WhatsApp-Image-2026-09-11-at-12.28.42.jpeg?fit=1280%2C853&ssl=1",["Reactive",95],{"$sauth-token":96,"$sauth-token-expires-at":97,"$snuxt-seo-utils:routeRules":98,"$sheader-mobile-open":99,"$ssession-expired":99,"$ssite-config":100},"",1793158257506,{"head":-1,"seoMeta":-1},false,{"_priority":101,"content":104,"defaultLocale":105,"description":106,"env":107,"indexable":108,"name":109,"url":110},{"env":102,"url":103,"name":103,"description":103,"defaultLocale":103,"indexable":103},-15,-3,"https://content.bmkg.go.id","id","BMKG memberikan informasi cuaca, iklim, kualitas udara, dan gempa bumi di seluruh wilayah Indonesia.","production",true,"BMKG - Badan Meteorologi, Klimatologi, dan Geofisika","https://www.bmkg.go.id",["Set"],["ShallowReactive",113],{"$f3jh5mykck2sjr":-1,"$fzh4xyxr96d1l":-1,"$f1eth3k3ni7exq":-1},"/siaran-pers"]</script></body></html>
