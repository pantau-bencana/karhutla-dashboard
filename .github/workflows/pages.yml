# Deploy situs statis ke GitHub Pages.
# Source Pages repositori ini adalah GitHub Actions.
# Hanya push ke main (dan workflow_dispatch pada main) yang mengunggah artefak dan men-deploy.
# Push dari GITHUB_TOKEN, termasuk commit data oleh github-actions[bot], tidak memicu workflow ini.
# Cuplikan baru juga di-deploy dari dalam refresh-data.yml dan refresh-cap.yml pada run yang sama.
# Bila ujung main sudah berpindah saat deploy, job ini membangun ulang SHA ujung itu lalu men-deploy-nya.
# Artefak commit lama tidak diunggah lagi, supaya situs tidak tertinggal di belakang push bot.
# Pull request, termasuk cabang cursor/*, hanya membangun dan memeriksa. Job deploy dilewati.
# Cron bisa tidak membuat run sama sekali, termasuk penjaga menit 7. Job picu-penjaga
# mengirim workflow_dispatch ke refresh-watchdog.yml. Penjaga di main yang memutuskan
# apakah data, CAP, atau prakiraan perlu dijalankan. Pull request dari fork tidak masuk.
# https://pantau-bencana.github.io/karhutla-dashboard/
# v0.2 ikut di dalam artefak yang sama, pada /v2/, lewat npm run build. Syarat deploy tidak berubah.
# https://pantau-bencana.github.io/karhutla-dashboard/v2/
name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    # Tanpa paths-ignore. Suntingan data/manual/bmkg-pdcht-dasarian.csv di main ikut membangun dan men-deploy situs.
  workflow_dispatch:
  pull_request:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.ref == 'refs/heads/main' && 'pages' || format('pages-preview-{0}', github.ref) }}
  cancel-in-progress: false
  queue: max

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Install
        run: npm ci

      - name: Periksa isian dasarian
        run: node scripts/validate-dasarian.mjs

      - name: Check and build
        env:
          VITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm run check && npm run build

      - name: Verify Pages paths and public config
        run: node scripts/verify-pages-build.mjs "${{ steps.pages.outputs.base_path }}"

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      actions: write
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Cek ujung main
        id: head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_REF_NAME}" --jq .sha)"
          echo "tip=${current}" >> "$GITHUB_OUTPUT"
          if [ "$current" != "$GITHUB_SHA" ]; then
            echo "rebuild=true" >> "$GITHUB_OUTPUT"
            echo "Ujung main sudah berpindah. main=${current} run=${GITHUB_SHA}. Membangun ujung main."
          else
            echo "rebuild=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout ujung main
        if: steps.head.outputs.rebuild == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.head.outputs.tip }}

      - name: Setup Node
        if: steps.head.outputs.rebuild == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Pages
        if: steps.head.outputs.rebuild == 'true'
        id: pages
        uses: actions/configure-pages@v6

      - name: Bangun ulang dari ujung main
        if: steps.head.outputs.rebuild == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          set -euo pipefail
          npm ci
          npm run check && npm run build
          node scripts/verify-pages-build.mjs "$VITE_BASE_PATH"
          tip_now="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_REF_NAME}" --jq .sha)"
          if [ "$tip_now" != "${{ steps.head.outputs.tip }}" ]; then
            echo "Ujung main berpindah lagi ke ${tip_now}. Memicu deploy baru."
            gh workflow run pages.yml --ref main
          fi

      - name: Ganti artefak Pages dengan ujung main
        if: steps.head.outputs.rebuild == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ids="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" --jq '.artifacts[] | select(.name=="github-pages" and .expired==false) | .id')"
          for id in $ids; do
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}"
          done
          sleep 2

      - name: Upload artefak ujung main
        if: steps.head.outputs.rebuild == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  picu-penjaga:
    # Jalan sejajar dengan build. Tidak memakai needs: deploy, supaya picu tidak
    # menunggu unggahan Pages dan tidak gagal bila deploy gagal.
    if: >-
      (github.event_name != 'pull_request' && github.ref == 'refs/heads/main')
      || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Picu penjaga jadwal
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Job ini tidak checkout. Tanpa --repo, gh mencari remote git dan gagal
          # ("not a git repository") sebelum permintaan dispatch terkirim.
          gh workflow run refresh-watchdog.yml --repo "$GITHUB_REPOSITORY" --ref main
          echo "Penjaga jadwal dipicu"
