# Deploy situs statis ke GitHub Pages.
# Source Pages repositori ini adalah GitHub Actions.
# Hanya push ke main (dan workflow_dispatch pada main) yang mengunggah artefak dan men-deploy.
# Push dari GITHUB_TOKEN, termasuk commit data oleh github-actions[bot], tidak memicu workflow ini.
# Cuplikan baru di-deploy dari dalam refresh-data.yml pada run yang sama.
# Deploy ini dilewati bila ujung main sudah berpindah, supaya artefak lama tidak menimpa cuplikan yang lebih baru.
# Pull request, termasuk cabang cursor/*, hanya membangun dan memeriksa. Job deploy dilewati.
# https://rixaga.github.io/karhutla-dashboard/
name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.ref == 'refs/heads/main' && 'pages' || format('pages-preview-{0}', github.ref) }}
  cancel-in-progress: false
  queue: max

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Install
        run: npm ci

      - name: Check and build
        env:
          VITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm run check && npm run build

      - name: Verify Pages paths and public config
        run: node scripts/verify-pages-build.mjs "${{ steps.pages.outputs.base_path }}"

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Lewati bila commit ini bukan ujung main
        id: head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_REF_NAME}" --jq .sha)"
          if [ "$current" != "$GITHUB_SHA" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Deploy dilewati. main=${current} run=${GITHUB_SHA}"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to GitHub Pages
        if: steps.head.outputs.skip != 'true'
        id: deployment
        uses: actions/deploy-pages@v5
